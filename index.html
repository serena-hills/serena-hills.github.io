<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serena Hills Hrazdan</title>
<meta name="description" content="Serena Hills Hrazdan — Ձեր նոր կյանքը՝ Հրազդանում">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Noto+Serif+Armenian:wght@500;600&family=Noto+Sans+Armenian:wght@400;500;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ====== НАСТРОЙКА ЦВЕТОВ ====== */
  :root{
    /* Верх — солнечное утро, одинаково в светлой и тёмной теме */
    --sky-top:#4F8DD6; --sky-mid:#93BFEA; --sky-low:#F8D9A8;
    --mount-back:#A9BDD8; --mount-front:#8BA3C4;
    --hill-far:#C6C46C; --hill-mid:#86AA4C; --hill-near:#3F6E35;
    --tree-far:#97A24C; --tree-mid:#4F7D34; --tree-near:#244A22;
    --paper:#FBFAF8; --ink:#17241F; --muted:#5B6964;
    --field:#FFFFFF; --line:#D6DEDA;
    --action:#2F5148; --action-ink:#FFFFFF;
    --pick:#E6EFEB; --error:#A3402E;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --paper:#111B19; --ink:#E5EDEA; --muted:#9AABA5;
      --field:#172422; --line:#2A3B37;
      --action:#93C7B7; --action-ink:#0F1A18;
      --pick:#1D3430; --error:#E79A88;
    }
  }
  *{box-sizing:border-box;margin:0}
  html{background:var(--paper)}
  body{
    font-family:"Noto Sans Armenian","Golos Text",system-ui,sans-serif;
    color:var(--ink);background:var(--paper);
    font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Noto Serif Armenian","Lora",Georgia,serif}

  /* ====== Верх: небо и холмы ====== */
  .hero{position:relative;overflow:hidden;padding-top:max(76px,calc(env(safe-area-inset-top) + 70px));
        background:
          radial-gradient(circle at 24% 53%,rgba(255,236,190,.95) 0,rgba(255,220,160,.55) 10%,rgba(255,214,150,.18) 26%,rgba(255,214,150,0) 42%),
          linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 48%,var(--sky-low) 82%)}
  .hero svg.land{position:relative;display:block;width:100%;height:auto;aspect-ratio:400/194;max-height:300px;margin:-34px 0 -1px;overflow:visible}
  .hero svg.clouds{position:absolute;inset:0 0 auto 0;width:100%;height:45%;z-index:0;pointer-events:none}
  .hill{transform-origin:bottom;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
  .hill.mid{animation-delay:.12s}.hill.near{animation-delay:.24s}.hill.front{animation:none}
  .sun{animation:sunUp 1.6s cubic-bezier(.2,.7,.2,1) both}
  /* Деревья качаются на ветру */
  @keyframes rise{from{transform:translateY(40px);opacity:0}}
  @keyframes sunUp{from{transform:translateY(30px);opacity:0}}

  .lang{position:absolute;top:max(52px,calc(env(safe-area-inset-top) + 40px));right:16px;z-index:3;display:flex;gap:4px;
        background:rgba(255,255,255,.22);border-radius:999px;padding:4px}
  .lang button{font:inherit;font-size:14px;border:0;background:none;color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:#fff;color:#1F3F66;font-weight:600}

  .brand{position:relative;z-index:4;text-align:center;padding:0 20px}
  .brand{color:#fff;text-shadow:0 1px 3px rgba(25,55,100,.35),0 1px 14px rgba(25,60,110,.45)}
  .brand .logo{display:block;height:48px;width:auto;margin:0 auto 6px;filter:drop-shadow(0 1px 8px rgba(25,60,110,.35))}
  .brand h1{font-family:"Lora",Georgia,serif;font-weight:500;font-size:clamp(20px,5.6vw,28px);line-height:1.04;letter-spacing:.09em;text-transform:uppercase}
  .brand .city{display:block;font-family:"Golos Text",system-ui,sans-serif;font-size:.4em;letter-spacing:.42em;margin:8px 0 0 .42em;font-weight:500;line-height:1}

  /* ====== Форма ====== */
  main{max-width:520px;margin:0 auto;padding:4px 20px 48px}
  .slogan{font-size:clamp(24px,6.4vw,30px);line-height:1.25;font-weight:600;text-align:center;margin-bottom:10px}
  .lead{color:var(--muted);text-align:center;margin:0 auto 28px;max-width:34ch}

  form{display:grid;gap:22px}
  label.f, .group > .q{display:block;font-weight:600;margin-bottom:8px;font-size:16px}
  .opt{font-weight:400;color:var(--muted)}
  input[type=text],input[type=tel],textarea{
    width:100%;font:inherit;color:var(--ink);background:var(--field);
    border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;outline:none;
    transition:border-color .15s;
  }
  textarea{min-height:88px;resize:vertical}
  input:focus,textarea:focus{border-color:var(--action)}
  .invalid input{border-color:var(--error)}
  .err{display:none;color:var(--error);font-size:14px;margin-top:6px}
  .invalid .err{display:block}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tiles input{position:absolute;opacity:0;pointer-events:none}
  .tile{display:flex;align-items:center;gap:10px;padding:14px;border:1.5px solid var(--line);
        border-radius:14px;background:var(--field);cursor:pointer;font-weight:500;min-height:56px;
        transition:background .15s,border-color .15s}
  .tile svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
  input:checked + .tile{border-color:var(--action);background:var(--pick)}
  input:checked + .tile svg{color:var(--action)}
  input:focus-visible + .tile{outline:2px solid var(--action);outline-offset:2px}

  .send{font:inherit;font-weight:600;font-size:18px;border:0;border-radius:16px;padding:18px;cursor:pointer;
        background:var(--action);color:var(--action-ink);transition:transform .1s,opacity .2s}
  .send:active{transform:scale(.98)}
  .send:disabled{opacity:.6;cursor:wait}
  .send:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:-8px}
  .fail{display:none;color:var(--error);text-align:center;font-size:15px}
  .hp{position:absolute;left:-9999px}

  /* ====== Успех ====== */
  .done{display:none;text-align:center;padding:24px 0 8px}
  .done .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:var(--pick);display:grid;place-items:center}
  .done .mark svg{width:30px;height:30px;stroke:var(--action);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .done h2{font-size:26px;margin-bottom:8px}
  .done p{color:var(--muted)}
  .sent form,.sent .lead{display:none}.sent .done{display:block}

  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 32px}

  @media (prefers-reduced-motion: reduce){.hill,.sun{animation:none}}
</style>
</head>

<script>
/* ====== ГЛАВНАЯ НАСТРОЙКА: ваша почта для заявок ====== */
const EMAIL = "badinrobert11@gmail.com";

const T = {
  hy:{
    slogan:"Ձեր նոր կյանքը՝ Serena Hills Hrazdan-ում",
    lead:"Թողեք Ձեր տվյալները, և մենք կպատմենք բնակարանների, գների և վճարման պայմանների մասին։",
    name:"Ձեր անունը", phone:"Հեռախոսահամար", method:"Ինչպե՞ս կապվենք Ձեզ հետ",
    call:"Զանգ", optional:"(ոչ պարտադիր)",
    comment:"Մեկնաբանություն", send:"Ուղարկել հայտը", sending:"Ուղարկվում է…",
    note:"Սեղմելով կոճակը՝ համաձայնում եք, որ մենք կապվենք Ձեզ հետ։",
    errName:"Գրեք Ձեր անունը", errPhone:"Գրեք Ձեր հեռախոսահամարը", errMethod:"Ընտրեք կապի եղանակը",
    fail:"Հայտը չուղարկվեց։ Ստուգեք ինտերնետը և փորձեք կրկին։",
    thanks:"Շնորհակալություն, հայտն ուղարկված է", soon:"Մենք շուտով կկապվենք Ձեզ հետ։"
  },
  ru:{
    slogan:"Ваша новая жизнь в Serena Hills Hrazdan",
    lead:"Оставьте контакты — расскажем о квартирах, ценах и условиях оплаты.",
    name:"Ваше имя", phone:"Номер телефона", method:"Как с вами связаться?",
    call:"Звонок", optional:"(необязательно)",
    comment:"Комментарий", send:"Отправить заявку", sending:"Отправляем…",
    note:"Нажимая кнопку, вы соглашаетесь, чтобы мы с вами связались.",
    errName:"Напишите ваше имя", errPhone:"Напишите номер телефона", errMethod:"Выберите способ связи",
    fail:"Заявка не отправилась. Проверьте интернет и попробуйте ещё раз.",
    thanks:"Спасибо, заявка отправлена", soon:"Мы скоро с вами свяжемся."
  }
};
let lang = (navigator.language||"").startsWith("ru") ? "ru" : "hy";
const $ = s => document.querySelector(s);

function setLang(l){
  lang = l; document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T[l][el.dataset.i18n]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===l));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
setLang(lang);

const digits = v => v.replace(/\D/g,"");
document.querySelectorAll("#form input, #form textarea").forEach(el =>
  el.addEventListener("input", () => el.closest(".field")?.classList.remove("invalid")));

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  $("#fail").style.display = "none";
  const name = $("#name").value.trim();
  const phone = $("#phone").value.trim();
  const method = document.querySelector("[name=method]:checked")?.value;
  // Приводим номер к виду 374XXXXXXXX: принимаем 091 123456, 91 123456, +374 091 123456 и т.п.
  let d = digits(phone);
  if (d.length===9 && d[0]==="0") d = "374" + d.slice(1);
  else if (d.length===8) d = "374" + d;
  else if (d.length===12 && d.startsWith("3740")) d = "374" + d.slice(4);
  const phoneNice = d.startsWith("374") && d.length===11
    ? "+374 " + d.slice(3,5) + " " + d.slice(5,8) + " " + d.slice(8)
    : phone;   // номер любого вида отправляется как есть

  const checks = [["#f-name", name.length>=1], ["#f-phone", phone.replace(/^\s*\+?\s*374\s*/,"").trim().length>0], ["#f-method", !!method]];
  checks.forEach(([id,ok]) => $(id).classList.toggle("invalid", !ok));
  const bad = checks.find(([,ok]) => !ok);
  if (bad){ $(bad[0]).querySelector("input")?.focus(); return; }
  if (document.querySelector("[name=_honey]").value) return;

  const methodRu = {call:"Звонок", WhatsApp:"WhatsApp", Telegram:"Telegram", Viber:"Viber"}[method];
  const btn = $("#send"); btn.disabled = true; btn.textContent = T[lang].sending;

  try{
    const res = await fetch("https://formsubmit.co/ajax/" + EMAIL, {
      method:"POST",
      headers:{"Content-Type":"application/json", "Accept":"application/json"},
      body: JSON.stringify({
        _subject: "Новая заявка Serena Hills: " + name + ", " + phoneNice + " (" + methodRu + ")",
        _template: "table",
        "Имя": name,
        "Телефон": phoneNice,
        "Как ввёл клиент": phone,
        "Как связаться": methodRu,
        "Комментарий": $("#comment").value.trim() || "—",
        "Написать в WhatsApp": "https://wa.me/" + d,
        "Язык сайта": lang === "ru" ? "русский" : "армянский"
      })
    });
    const data = await res.json();
    if (String(data.success) !== "true") throw new Error(data.message);
    $("#app").classList.add("sent");
    window.scrollTo({top:0, behavior:"smooth"});
  }catch(err){
    $("#fail").style.display = "block";
    btn.disabled = false; btn.textContent = T[lang].send;
  }
});
/* ====== Деревья качаются на ветру ======
   LEAN — насколько сильно порыв наклоняет деревья (градусы)
   SWAY — размах качания туда-сюда (градусы)
   GUST — длительность одного порыва ветра (секунды) */
/* Облака медленно плывут */
(function(){
  const clouds=[...document.querySelectorAll(".cloud")].map(el=>({el,x:+el.dataset.x,y:+el.dataset.y,v:+el.dataset.v}));
  let last=0;
  function step(ms){
    const dt=last?(ms-last)/1000:0; last=ms;
    for(const c of clouds){ c.x+=c.v*dt; if(c.x>440)c.x=-40; c.el.setAttribute("transform","translate("+c.x.toFixed(2)+" "+c.y+")"); }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();

const LEAN = 8, SWAY = 4, GUST = 5;
(function(){
  const trees=[...document.querySelectorAll(".sway")].map((el,i)=>{
    const x=parseFloat(el.parentNode.getAttribute("transform").match(/translate\(([\d.]+)/)[1]);
    return {el, x, speed:1.5+((i*37)%10)/12, phase:i*1.7};
  });
  // плавная кривая: медленно набирает силу, ускоряется, потом так же плавно отпускает
  const gustAt = t => { const k=(1-Math.cos(2*Math.PI*t/GUST))/2; return k*k*(3-2*k); };
  function frame(ms){
    const t=ms/1000;
    for(const tr of trees){
      const g=gustAt(t - tr.x/260);              // порыв идёт по холмам слева направо
      const sway=Math.sin(t*tr.speed+tr.phase)*SWAY*(0.5+0.7*g);
      const a=g*LEAN + sway;
      tr.el.setAttribute("transform","rotate("+a.toFixed(2)+") skewX("+(a*0.7).toFixed(2)+")");
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
